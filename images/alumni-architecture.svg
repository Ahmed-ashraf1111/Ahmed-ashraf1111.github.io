<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Alumni Portal architecture</title>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="690" fill="#0b1220"/>
  <rect x="1" y="1" width="1198" height="688" fill="none" stroke="#1f2a44"/>

  <!-- Layer 1: client -->
  <rect x="60" y="30" width="1080" height="190" rx="18" fill="#101827" stroke="#24304d"/>
  <text x="90" y="64" fill="#22d3ee" font-size="15" font-weight="700" letter-spacing="1.5">CLIENT: REACT.JS SINGLE PAGE APPLICATION</text>

  <g font-size="16" font-weight="600" fill="#e6eaf2">
    <rect x="90" y="82" width="240" height="66" rx="12" fill="#111c33" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="210" y="109" text-anchor="middle">Landing</text>
    <text x="210" y="130" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">Portal info and sign in</text>

    <rect x="350" y="82" width="240" height="66" rx="12" fill="#111c33" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="470" y="109" text-anchor="middle">Alumni Portal</text>
    <text x="470" y="130" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">Feed, profile, friends</text>

    <rect x="610" y="82" width="240" height="66" rx="12" fill="#111c33" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="730" y="109" text-anchor="middle">Community</text>
    <text x="730" y="130" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">Groups and discussions</text>

    <rect x="870" y="82" width="240" height="66" rx="12" fill="#111c33" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="990" y="109" text-anchor="middle">Admin Dashboard</text>
    <text x="990" y="130" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">Verification and documents</text>
  </g>

  <text x="600" y="190" text-anchor="middle" font-size="13.5" fill="#94a3b8">Axios interceptors with JWT   |   React Hooks state   |   Socket.io client</text>

  <!-- Links between client and server -->
  <line x1="450" y1="222" x2="450" y2="262" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="246" font-size="13" fill="#94a3b8">REST API (JSON)</text>
  <line x1="750" y1="222" x2="750" y2="262" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="766" y="246" font-size="13" fill="#94a3b8">WebSocket (Socket.io)</text>

  <!-- Layer 2: server -->
  <rect x="60" y="265" width="1080" height="205" rx="18" fill="#101827" stroke="#24304d"/>
  <text x="90" y="297" fill="#22d3ee" font-size="15" font-weight="700" letter-spacing="1.5">SERVER: NODE.JS AND EXPRESS.JS (RESTFUL API)</text>

  <g font-size="16" font-weight="600" fill="#e6eaf2">
    <rect x="75" y="315" width="190" height="76" rx="12" fill="#111c33" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="170" y="358" text-anchor="middle">CORS</text>

    <rect x="290" y="315" width="190" height="76" rx="12" fill="#111c33" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="385" y="347" text-anchor="middle">Security</text>
    <text x="385" y="369" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Helmet, HPP, XSS, rate limit</text>

    <rect x="505" y="315" width="190" height="76" rx="12" fill="#111c33" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="600" y="358" text-anchor="middle">Validation</text>

    <rect x="720" y="315" width="190" height="76" rx="12" fill="#111c33" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="815" y="358" text-anchor="middle">Controllers</text>

    <rect x="935" y="315" width="190" height="76" rx="12" fill="#111c33" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="1030" y="347" text-anchor="middle">Sequelize ORM</text>
    <text x="1030" y="369" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Models and relations</text>
  </g>

  <!-- Flow arrows inside the server -->
  <g stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)">
    <line x1="265" y1="353" x2="288" y2="353"/>
    <line x1="480" y1="353" x2="503" y2="353"/>
    <line x1="695" y1="353" x2="718" y2="353"/>
    <line x1="910" y1="353" x2="933" y2="353"/>
  </g>

  <g font-size="14" fill="#e6eaf2">
    <rect x="75" y="412" width="520" height="40" rx="10" fill="#0b1426" stroke="#24304d"/>
    <text x="335" y="437" text-anchor="middle">Auth: JWT, bcrypt password hashing, RBAC</text>

    <rect x="620" y="412" width="505" height="40" rx="10" fill="#0b1426" stroke="#24304d"/>
    <text x="872" y="437" text-anchor="middle">Socket.io server: chat, notifications, live posts</text>
  </g>

  <!-- Links from server to data and services -->
  <g stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)">
    <line x1="210" y1="472" x2="210" y2="538"/>
    <line x1="470" y1="472" x2="470" y2="538"/>
    <line x1="730" y1="472" x2="730" y2="538"/>
    <line x1="990" y1="472" x2="990" y2="538"/>
  </g>

  <text x="340" y="510" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700" letter-spacing="1.5">DATA AND SERVICES</text>

  <!-- Layer 3: data and external services -->
  <g fill="#e6eaf2" font-size="17" font-weight="700">
    <rect x="90" y="540" width="240" height="110" rx="14" fill="#111c33" stroke="url(#grad)" stroke-width="1.5"/>
    <text x="210" y="580" text-anchor="middle">PostgreSQL</text>
    <text x="210" y="606" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">Main database,</text>
    <text x="210" y="625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">accessed through Sequelize</text>

    <rect x="350" y="540" width="240" height="110" rx="14" fill="#111c33" stroke="url(#grad)" stroke-width="1.5"/>
    <text x="470" y="580" text-anchor="middle">Cloudinary</text>
    <text x="470" y="606" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">File and image storage,</text>
    <text x="470" y="625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">uploads handled by Multer</text>

    <rect x="610" y="540" width="240" height="110" rx="14" fill="#111c33" stroke="url(#grad)" stroke-width="1.5"/>
    <text x="730" y="580" text-anchor="middle">University services</text>
    <text x="730" y="606" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">Mock services for graduate</text>
    <text x="730" y="625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">and staff verification</text>

    <rect x="870" y="540" width="240" height="110" rx="14" fill="#111c33" stroke="url(#grad)" stroke-width="1.5"/>
    <text x="990" y="580" text-anchor="middle">Cohere AI</text>
    <text x="990" y="606" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">AI content moderation</text>
    <text x="990" y="625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">for posts</text>
  </g>
</svg>
